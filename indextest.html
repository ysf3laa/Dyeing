</div>
</div></div>)}
{stageMgr&&(<div className="modal" onClick={()=>setStageMgr(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3 style={{margin:"0 0 10px"}}>🎚️ {t.stageMgr}</h3>
{stages.map((s,i)=>(<div key={s} style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
<span style={{flex:1,fontSize:14}}>{stageIcon(s,i)} {s}</span>
<button className="chip" onClick={()=>moveStageOrder(s,-1)}>⬆️</button>
<button className="chip" onClick={()=>moveStageOrder(s,1)}>⬇️</button>
<button className="chip" onClick={()=>{const n=prompt(t.rename,s);if(n&&n.trim()&&n!==s)renameStage(s,n.trim());}}>✏️</button>
<button className="chip" onClick={()=>{const e=prompt("🎭 اكتب إيموجي للمرحلة:",(factory.stageIcons||{})[s]||"");if(e===null)return;const m=Object.assign({},factory.stageIcons);if(e.trim()){m[s]=e.trim();}else{delete m[s];}saveFactory({stageIcons:m});}}>🎭</button>
<button className="chip" style={{borderColor:"var(--red)",color:"var(--red)"}} onClick={()=>setDelStage(s)}>🗑️</button>
</div>))}
<button className="btnG" onClick={addStage}>➕ {t.addStage}</button>
</div></div>)}
{delStage&&(<div className="modal"><div className="mbox" style={{maxWidth:360}} onClick={e=>e.stopPropagation()}>
<h3 style={{margin:"0 0 10px"}}>🗑️ حذف مرحلة "{delStage}"</h3>
<p style={{fontSize:13,color:"var(--dim)"}}>الكروت هتنتقل لـ:</p>
{stages.filter(s=>s!==delStage).map(s=><button key={s} className="chip" style={{marginBottom:6,marginInlineEnd:6}} onClick={()=>deleteStageFlow(delStage,s)}>{s}</button>)}
<div style={{marginTop:8}}><button className="btnO" onClick={()=>setDelStage(null)}>{t.cancel}</button></div>
</div></div>)}
{showSettings&&(<div className="modal" onClick={()=>setShowSettings(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<div style={{display:"flex",alignItems:"center"}}><h3 style={{flex:1,margin:"0 0 12px"}}>⚙️ {t.settings}</h3><button onClick={()=>setShowSettings(false)} style={{...hdrBtn,border:"none"}}>✕</button></div>
<div className="lbl">👷 العمال</div>
{users.map(u=><div key={u.id} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
<span style={{flex:1,fontSize:13}}>{u.role==="owner"?"👑":""} {u.name}</span>
<button className="chip" onClick={()=>{const c=prompt("كود جديد لـ "+u.name+":");if(!c)return;col("users").doc(u.id).set({code:c},{merge:true});showToast("🔑 تم");}}>🔑</button>
<button className="chip" style={{borderColor:"var(--red)",color:"var(--red)"}} onClick={()=>{if(confirm("حذف "+u.name+"؟"))col("users").doc(u.id).delete();}}>🗑️</button>
</div>)}
<button className="btnO" style={{marginBottom:10}} onClick={()=>{const n=prompt("اسم العامل الجديد:");if(!n)return;const c=Math.floor(1000+Math.random()*9000)+"";col("users").add({name:n,role:"worker",code:c}).then(()=>showToast("🔑 كوده: "+c));alert("🔑 كود الدخول: "+c);}}>➕ إضافة عامل</button>
<div className="lbl">🎛️ خانات الكارت (بتظهر لكل عمالك)</div>
<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
{["msg","category","machine","barcode"].map(k=><button key={k} className={"chip"+((factory.cardCfg||{})[k]!==false?" on":"")} onClick={()=>{const cur=Object.assign({msg:true,category:true,machine:true,barcode:true},factory.cardCfg||{});cur[k]=!cur[k];saveFactory({cardCfg:cur});}}>{k==="msg"?"الرسالة":k==="category"?"الصنف":k==="machine"?"الماكينة":"الباركود"}</button>)}
</div>
<div className="lbl">👤 تعديل اسمك</div>
<div style={{display:"flex",gap:6}}><input className="inp" style={{flex:1}} value={nameDraft} onChange={e=>setNameDraft(e.target.value)}/><button className="chip on" onClick={()=>{saveFactory({ownerName:nameDraft});setMe(m=>({...m,name:nameDraft}));showToast("💾 ✅");}}>حفظ</button></div>
<div className="lbl">🏭 اسم المصنع</div>
<input className="inp" defaultValue={factory.fname||""} onBlur={e=>{saveFactory({fname:e.target.value});setFactory(f=>({...f,fname:e.target.value}));}}/>
<div className="lbl">🖼️ لوجو الشركة</div>
<div style={{display:"flex",gap:6,alignItems:"center",marginBottom:10}}>
{logoSrc&&<img src={logoSrc} style={{width:44,height:44,borderRadius:10,objectFit:"cover"}}/>}
<button onClick={()=>{const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const m=Math.max(img.width,img.height);const sc=Math.min(1,256/m);const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);const d=c.toDataURL("image/png");saveFactory({logo:d});setFactory(f=>({...f,logo:d}));};img.src=rd.result;};rd.readAsDataURL(f);};document.body.appendChild(inp);inp.click();setTimeout(()=>inp.remove(),2000);}} className="chip on">📤 رفع لوجو</button>
{logoSrc&&<button onClick={()=>{saveFactory({logo:""});setFactory(f=>({...f,logo:""}));try{localStorage.removeItem("logo_"+(tenant||"_"));}catch(e){}}} className="chip">🗑️</button>}
</div>
<div className="lbl">📱 {t.waNumber}</div>
<input className="inp" inputMode="numeric" placeholder="201xxxxxxxxx" defaultValue={factory.wa||""} onBlur={e=>saveFactory({wa:e.target.value})}/>
<div style={grid2}>
<div><div className="lbl">🖨️ {t.printSize}</div><select className="inp" value={factory.printSize||"A4"} onChange={e=>saveFactory({printSize:e.target.value})}><option>A4</option><option>A5</option></select></div>
<div><div className="lbl">⚖️ {t.unit}</div><select className="inp" value={factory.unit||"كيلو"} onChange={e=>saveFactory({unit:e.target.value})}><option>كيلو</option><option>جرام</option><option>قطعة</option></select></div>
</div>
<div className="lbl">⏰ {t.lateAfter}</div>
<input className="inp" type="number" defaultValue={factory.lateAfter||20} onBlur={e=>saveFactory({lateAfter:+e.target.value||20})}/>
<div className="lbl">🔒 رقم سري للإعدادات (سيبها فاضية = مقفول)</div>
<input className="inp" type="number" placeholder="بدون رمز" value={pinLoc} onChange={e=>{setPinLoc(e.target.value);try{localStorage.setItem("pin_"+(tenant||"_"),e.target.value);}catch(x){}}}/>
<div className="lbl">🗄️ أرشفة تلقائية للمسلّم بعد (يوم) — 0 مقفول</div>
<input className="inp" type="number" placeholder="0" value={archLoc} onChange={e=>{setArchLoc(e.target.value);try{localStorage.setItem("autoArch_"+(tenant||"_"),e.target.value);}catch(x){}}}/>
<div className="lbl">📢 إعلان لكل العمال</div>
<textarea rows={2} className="inp" value={announceText} onChange={e=>setAnnounceText(e.target.value)}/>
<div style={{display:"flex",gap:8,marginBottom:10}}>
<button className="btnG" style={{flex:1}} onClick={()=>{db.collection("t/"+tenant+"/config").doc("announce").set({text:announceText,by:ownerName,time:Date.now()});showToast("📢 نشر");}}>📢 نشر</button>
<button className="btnO" style={{flex:1}} onClick={()=>{db.collection("t/"+tenant+"/config").doc("announce").set({text:"",by:"",time:Date.now()});showToast("🗑️");}}>🗑️ مسح الإعلان</button>
</div>
<div style={{fontSize:12,color:"var(--dim)",marginBottom:10}}>🌐 اللغة بتتحفظ على كل جهاز من زر اللغة تلقائياً</div>
</div></div>)}
{toast&&(<div style={{position:"fixed",bottom:96,left:"50%",transform:"translateX(-50%)",background:toast.kind==="danger"?"var(--red)":"var(--teal)",color:"#04211a",fontWeight:800,padding:"10px 18px",borderRadius:30,zIndex:999,animation:"pop .25s both",display:"flex",gap:10,alignItems:"center",maxWidth:"86%"}}>{toast.msg}{toast.action&&<button onClick={()=>{toast.action.fn();setToast(null);}} style={{background:"rgba(0,0,0,.15)",border:"none",borderRadius:12,padding:"6px 10px",fontWeight:800,color:"#04211a"}}>{toast.action.label}</button>}</div>)}
{confetti&&(<div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:998,overflow:"hidden"}}>{Array.from({length:40}).map((_,i)=>(<span key={i} style={{position:"absolute",top:"-10px",insetInlineStart:(i*2.5)+"%",width:8,height:12,background:["#7C5CFF","#2DD4A8","#FFB65C","#FF5C7A","#4CC9F0"][i%5],borderRadius:3,animation:"confFall 2.6s linear "+((i%10)*0.12)+"s both"}}/>))}</div>)}
</div>);
}
try{ReactDOM.render(<App/>,document.getElementById("root"));document.title="✅ OK";}catch(e){document.getElementById("root").innerHTML='<pre style="color:#ff5c7a;padding:12px;white-space:pre-wrap">'+e.message+'</pre>';document.title="❌ ERR";}
</script>
</body>
</html>
