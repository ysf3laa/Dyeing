function parseVoice(txt){
const d={customer:"",message:"",code:"",machine:"",category:"",color:"",quantity:"",barcode:"",prepare:"",dye:"",time:"",notes:""};
let t2=(txt||"").replace(/[٠-٩]/g,function(dd){return String("٠١٢٣٤٥٦٧٨٩".indexOf(dd));});
t2=t2.split(/\s+/).filter(function(w,i,a){return w&&w!==a[i-1];}).join(" ");
const KW={customer:/عميل|العميل|customer|client/,code:/كود|code/,message:/رسالة|message|batch/,machine:/ماكينة|machine/,category:/صنف|خامة|category|fabric/,color:/لون|اللون|color/,quantity:/كمية|وزن|quantity|qty|weight/,barcode:/باركود|barcode/,time:/تاريخ|date/,notes:/ملاحظ|طلبات|note/};
const STRIP=/^(عميل|العميل|customer|client|كود|code|رسالة|message|batch|ماكينة|machine|صنف|خامة|category|fabric|لون|اللون|color|كمية|وزن|quantity|qty|weight|باركود|barcode|تاريخ|date|ملاحظ|ملاحظات|طلبات|notes?)$/i;
const pos=[];
Object.keys(KW).forEach(function(k){const re=KW[k];re.lastIndex=0;const m=re.exec(t2);if(m)pos.push([m.index,m[0].length,k]);});
pos.sort(function(a,b){return a[0]-b[0];});
for(let i=0;i<pos.length;i++){const s=pos[i][0]+pos[i][1];const e2=i+1<pos.length?pos[i+1][0]:t2.length;
const words=t2.slice(s,e2).split(/\s+/).filter(function(w){return w&&!STRIP.test(w);});
d[pos[i][2]]=words.join(" ").replace(/^[\s:\-،]+/,"").trim();}
["code","message","machine","quantity","barcode"].forEach(function(f){const m=(d[f]||"").match(/\d+(?:[.,]\d+)?/);if(m)d[f]=m[0];});
if(!d.customer&&!d.code&&!d.quantity){
const toks=t2.split(/\s+/).filter(function(w){return w&&!STRIP.test(w);});
const items=toks.map(function(tk){return {tk:tk,isNum:/^\d+(?:[.,]\d+)?$/.test(tk),isAr:/[\u0600-\u06FF]/.test(tk)};});
const phrases=[];let cur=null;
items.forEach(function(it){const ty=it.isNum?"num":(it.isAr?"ar":"x");if(!cur||cur.type!==ty){cur={type:ty,words:[]};phrases.push(cur);}cur.words.push(it.tk);});
const ars=phrases.filter(function(p){return p.type==="ar";}).map(function(p){return p.words.join(" ");});
const nums=phrases.filter(function(p){return p.type==="num";}).map(function(p){return p.words.join(" ");});
if(ars[0])d.customer=ars[0];
if(ars[1])d.category=ars[1];
if(ars[2])d.color=ars[2];
if(ars[3])d.notes=ars.slice(3).join(" ");
nums.forEach(function(v){if(/^26\d{5}$/.test(v))d.barcode=v;});
const small=nums.filter(function(v){return !/^26\d{5}$/.test(v);});
if(small[0])d.code=small[0];
if(small[1])d.message=small[1];
if(small[2])d.quantity=small[2];
if(small[3])d.machine=small[3];
if(!d.customer&&!d.barcode)d.notes=t2.trim();
}
return d;}

<div className="modal" onClick={()=>setActionCard(null)}>
<div className="mbox" onClick={e=>e.stopPropagation()} style={{maxWidth:340,padding:10}}>
<div style={{padding:"8px 10px 12px",fontWeight:800}}>{actionCard.customer} · {actionCard.code}</div>
{[
...(can?[{icon:"✏️",label:t.edit,fn:()=>{setEditingCard(actionCard);setActionCard(null);}}]:[]),
...(can&&nextStageOf(actionCard.stage)?[{icon:"⏭️",label:t.nextStage,fn:()=>moveCardTo(actionCard,nextStageOf(actionCard.stage))}]:[]),
{icon:"👤",label:t.statement,fn:()=>{setStatementFor(actionCard.customer);setActionCard(null);}},
...(can?[{icon:actionCard.delivered?"↩️":"✅",label:actionCard.delivered?"إلغاء التسليم":"تم التسليم",fn:()=>toggleDelivered(actionCard)},
{icon:"⚖️",label:"تسليم جزئي",fn:()=>{const q=prompt("الكمية المسلّمة من الكرت:",actionCard.quantity||"");if(q!==null)partialDeliver(actionCard,q);}}]:[]),
{icon:"💬",label:t.shareCard,fn:()=>{window.open(waLink(shareCardText(actionCard)),"_blank");setActionCard(null);}},
...(can?[{icon:"📋",label:t.copyCard,fn:()=>{setCopyCard(actionCard);setActionCard(null);}},
{icon:"🔄",label:t.moveCard,fn:()=>{setMoveCard(actionCard);setActionCard(null);}},
{icon:"⭐",label:actionCard.pinned?t.unpin:t.pinCard,fn:()=>togglePin(actionCard)}]:[]),
{icon:"🖨️",label:t.printCard,fn:()=>{printCard(actionCard);setActionCard(null);}},
{icon:"🔳",label:t.showBarcode,fn:()=>{setBcCard(actionCard);setActionCard(null);}},
{icon:"📱",label:t.showQr,fn:()=>{setQrCard(actionCard);setActionCard(null);}},
...(actionCard.photo?[{icon:"🖼️",label:t.viewPhoto,fn:()=>{setPhotoView(actionCard);setActionCard(null);}}]:[]),
...(can?[{icon:"🗄️",label:actionCard.archived?t.unarchive:t.archiveCard,fn:()=>toggleArchive(actionCard)},
{icon:"🗑️",label:t.delete,fn:()=>deleteCard(actionCard),danger:true}]:[])
].map((it,i)=>(<button key={i} onClick={it.fn} className="anim" style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"12px 10px",background:"transparent",border:"none",borderTop:"1px solid "+theme.border,color:it.danger?"var(--red)":theme.text,fontSize:14.5,textAlign:"start",animationDelay:(i*40)+"ms"}}>{it.icon} {it.label}</button>))}
</div></div>)}
{moveCard_&&(
<div className="modal" onClick={()=>setMoveCard(null)}>
<div className="mbox" onClick={e=>e.stopPropagation()} style={{maxWidth:340}}>
<h3 style={{margin:"0 0 14px"}}>{t.moveCard}</h3>
{stages.filter((v,i,a)=>a.indexOf(v)===i).map((s,i)=>(<button key={s} onClick={()=>moveCardTo(moveCard_,s)} className="card anim" style={{width:"100%",padding:"12px 10px",textAlign:"start",marginBottom:8,animationDelay:(i*50)+"ms"}}>{s}</button>))}
</div></div>)}
{copyCard_&&(
<div className="modal" onClick={()=>setCopyCard(null)}>
<div className="mbox" onClick={e=>e.stopPropagation()} style={{maxWidth:340}}>
<h3 style={{margin:"0 0 14px"}}>{t.copyCard}</h3>
{stages.map((s,i)=>(<button key={s} onClick={()=>copyCardTo(copyCard_,s)} className="card anim" style={{width:"100%",padding:"12px 10px",textAlign:"start",marginBottom:8,animationDelay:(i*50)+"ms"}}>{s}</button>))}
</div></div>)}
{qrCard&&(
<div className="modal" onClick={()=>setQrCard(null)}>
<div className="mbox" onClick={e=>e.stopPropagation()} style={{maxWidth:340,textAlign:"center"}}>
<h3>📱 {t.showQr}</h3>
<div style={{display:"flex",justifyContent:"center",margin:"10px 0"}}><QrView value={pubUrl(qrCard)} size={200}/></div>
<p style={{fontSize:13,color:theme.textDim}}>{qrCard.customer} · {qrCard.barcode||qrCard.code}</p>
</div></div>)}
{showSearch&&(
<div className="modal" onClick={()=>setShowSearch(false)}>
<div className="mbox" onClick={e=>e.stopPropagation()}>
<h3 style={{margin:"0 0 14px"}}>{t.search}</h3>
<SearchModal t={t} cards={liveCards} onPick={c=>{setShowSearch(false);jumpToCard(c);}}/>
</div></div>)}
{showSettings&&(
<div className="modal" onClick={()=>setShowSettings(false)}>
<div className="mbox" onClick={e=>e.stopPropagation()} style={{maxWidth:400}}>
<h3 style={{margin:"0 0 14px"}}>⚙️ {t.settings}</h3>
<div className="lbl">🌐 {t.language}</div><div style={{marginBottom:10}}><button onClick={()=>{const n=lang==="ar"?"en":"ar";setLang(n);localStorage.setItem("pref_lang",n);}} className="chip on">{lang==="ar"?"العربية":"English"}</button></div>
{!can&&(<div className="card" style={{padding:14,marginBottom:10}}>
<div className="lbl">🔑 {t.unlockTitle}</div>
<input className="inp" inputMode="numeric" value={codeInput} onChange={e=>setCodeInput(e.target.value)} placeholder="******"/>
<button onClick={tryUnlock} className="btnG">🔓 {t.confirmName}</button>
<p style={{fontSize:11,color:theme.textDim,marginTop:8}}>{t.unlockHint}</p>
</div>)}
{can&&(<>
<div className="lbl">🤖 مفتاح Gemini (قراءة ذكية لكل العمال)</div><input className="inp" placeholder="AIza..." value={gemKey||factory.gkey||""} onChange={e=>{setGemKey(e.target.value);localStorage.setItem("gemini_key",e.target.value.trim());saveFactory({gkey:e.target.value.trim()});}}/>
<p style={{fontSize:11,color:theme.textDim,marginBottom:8}}>مفتاح مجاني من aistudio.google.com/app/apikey — احطه مرة واحدة ويشتغل عند كل العمال تلقائياً</p>
<div className="lbl">👤 {t.yourNameEdit}</div><div style={{display:"flex",gap:6,marginBottom:10}}><input className="inp" style={{marginBottom:0}} value={nameDraft} onChange={e=>setNameDraft(e.target.value)}/><button onClick={()=>{if(nameDraft.trim()){setOwnerName(nameDraft.trim());localStorage.setItem("owner_name_"+userId,nameDraft.trim());showToast("✅");}}} className="chip on">{t.save}</button></div>
<div className="lbl">🏭 {t.factoryName}</div><input className="inp" value={fnameDraft} onChange={e=>setFnameDraft(e.target.value)}/>
<div className="lbl">📱 {t.waNumber}</div><input className="inp" inputMode="numeric" placeholder="201xxxxxxxxx" value={waDraft} onChange={e=>setWaDraft(e.target.value)}/>
<div style={grid2}>
<div><div className="lbl">⚖️ {t.unit}</div><select className="inp" value={factory.unit} onChange={e=>saveFactory({unit:e.target.value})}>{["كيلو","قطعة","متر","دستة","طن"].map(u=><option key={u}>{u}</option>)}</select></div>
<div><div className="lbl">🖨️ {t.printSize}</div><select className="inp" value={factory.printSize} onChange={e=>saveFactory({printSize:e.target.value})}>{["A5","A4"].map(u=><option key={u}>{u}</option>)}</select></div></div>
<div className="lbl">⏰ {t.lateDays}</div><input className="inp" type="number" min="1" value={lateDraft} onChange={e=>setLateDraft(e.target.value)}/>
<button onClick={saveFactoryDrafts} className="btnG" style={{marginBottom:10}}>💾 {t.saveFactoryBtn}</button>
<div className="lbl">🎚️ {t.manageStages}</div><div style={{marginBottom:10}}>{stages.map(s=>(<div key={s} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}><span style={{flex:1,fontSize:13}}>{s}</span><button onClick={()=>{const n=prompt(t.rename,s);if(n&&n.trim()&&n!==s)renameStage(s,n.trim());}} className="chip">✏️</button><button onClick={()=>{if(confirm(t.delete+" "+s))saveStages(stages.filter(x=>x!==s));}} className="chip">🗑️</button></div>))}
<button onClick={()=>{const n=prompt(t.addStage);if(n&&n.trim()&&!stages.includes(n.trim()))saveStages(stages.concat([n.trim()]));}} className="chip" style={{marginTop:4}}>➕</button></div>
<div className="lbl">🔧 {t.manageMachines}</div><div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>{machines.map(m=><button key={m} onClick={()=>{if(confirm(t.delete+" "+m))saveMachines(machines.filter(x=>x!==m));}} className="chip">{m} ✕</button>)}<button onClick={()=>{const n=prompt(t.add);if(n&&n.trim()&&!machines.includes(n.trim()))saveMachines(machines.concat([n.trim()]));}} className="chip on">➕</button></div>
<div className="lbl">🎨 {t.manageColors}</div><div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>{customColors.map(c=><button key={c} onClick={()=>saveColors(customColors.filter(x=>x!==c))} className="chip">{c} ✕</button>)}<button onClick={()=>{const n=prompt(t.add);if(n&&n.trim())saveColors(customColors.concat([n.trim()]));}} className="chip on">➕</button></div>
<div style={{...grid2,marginTop:8}}>
<button onClick={()=>setAppQr(true)} className="btnO">🔳 {t.appQr}</button>
<button onClick={()=>backupJSON()} className="btnO">💾 {t.backupFull}</button>
<button onClick={()=>restoreRef.current&&restoreRef.current.click()} className="btnO">♻️ {t.restore}</button>
<button onClick={()=>{if(wipeConfirm){wipeAll();}else{setWipeConfirm(true);setTimeout(()=>setWipeConfirm(false),3000);}}} className="btnO" style={{borderColor:"var(--red)",color:wipeConfirm?"#fff":"var(--red)",background:wipeConfirm?"var(--red)":"transparent"}}>{wipeConfirm?"⚠️ "+t.wipeSure:"🗑️ "+t.wipe}</button>
</div></>)}
</div></div>)}
{toast&&(<div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",background:toast.kind==="danger"?"var(--red)":"var(--teal)",color:"#fff",padding:"10px 22px",borderRadius:30,fontSize:14,fontWeight:800,zIndex:999,animation:"pop .3s both",boxShadow:"0 8px 24px rgba(0,0,0,.4)"}}>{toast.msg}</div>)}
</div>);
}
function SearchModal({t,cards,onPick}){
const [q,setQ]=useState("");
const r=q.trim()?cards.filter(c=>FIELD_KEYS.some(k=>(c[k]||"").toString().toLowerCase().includes(q.toLowerCase()))).slice(0,20):[];
return(<div><input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder={t.search} className="inp"/>
{q.trim()&&r.length===0&&<p style={{color:"var(--dim)",fontSize:13,textAlign:"center"}}>{t.noResults}</p>}
<div>{r.map((c,i)=>(<div key={c.id} onClick={()=>onPick(c)} className="card anim" style={{cursor:"pointer",padding:"10px 12px",marginBottom:8,animationDelay:(i*40)+"ms"}}><b style={{fontSize:14}}>{c.customer} · {c.code}</b><div style={{fontSize:12,color:"var(--dim)"}}>{c.stage} — {c.color}</div></div>))}</div></div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
window.__booted=true;
</script>
</body>
</html>
