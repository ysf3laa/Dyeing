<h3>⚙️ {actionCard.customer||""}</h3>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
<button className="btnO" onClick={()=>{printCard(actionCard);setActionCard(null);}}>🖨️ {t.printCard}</button>
<button className="btnO" onClick={()=>{window.open(waLink(shareCardText(actionCard)),"_blank");setActionCard(null);}}>💬 {t.share}</button>
<button className="btnO" onClick={()=>{notifyCustomer(actionCard);setActionCard(null);}}>📢 تبليغ</button>
<button className="btnO" onClick={()=>{toggleDeliver(actionCard);setActionCard(null);}}>{actionCard.delivered?"↩️ إلغاء":"✅ تسليم"}</button>
<button className="btnO" onClick={()=>{setArch(actionCard,!actionCard.archived);setActionCard(null);}}>{actionCard.archived?"📤 إرجاع":"🗄️ أرشفة"}</button>
<button className="btnO" onClick={()=>{if(actionCard.customer)toggleFav(actionCard.customer);setActionCard(null);}}>{favs.includes(actionCard.customer)?"🔕 فك":"📌 تثبيت"}</button>
{can&&<button className="btnO danger" onClick={()=>{if(window.confirm("حذف الكرت؟"))deleteCard(actionCard);setActionCard(null);}}>🗑️ حذف</button>}
</div>
<button className="btnO" style={{marginTop:8}} onClick={()=>setActionCard(null)}>{t.cancel}</button>
</div></div>)}
{showSearch&&(<div className="modal" onClick={()=>setShowSearch(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>🔍 {t.search}</h3>
<input className="inp" autoFocus value={searchQ} onChange={e=>setSearchQ(e.target.value)}/>
{searchResults.map(c=>(<div key={c.id} className="card" onClick={()=>{setShowSearch(false);setEditingCard(c);}}><b>{c.customer}</b> · {c.code||""} · {c.stage}</div>))}
</div></div>)}
{showNotif&&(<div className="modal" onClick={()=>setShowNotif(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>🔔 الإشعارات</h3>
{announce&&announce.text&&<div className="card grad" style={{padding:10}}>📢 {announce.text}<div style={{fontSize:10,opacity:.8}}>{announce.by}</div></div>}
{logs.slice(0,20).map(l=>(<div key={l.id} style={{fontSize:12,color:theme.textDim,padding:"6px 0",borderBottom:"1px solid "+theme.border}}>{l.txt} · {l.by} · {fmtTime(l.time,lang)}</div>))}
</div></div>)}
{showMenu&&(<div className="modal" onClick={()=>setShowMenu(false)}><div className="mbox" onClick={e=>e.stopPropagation()} style={{maxWidth:340}}>
<h3>⋯ القائمة</h3>
<div style={{display:"grid",gap:8}}>
{can&&<button className="btnO" onClick={()=>{setShowMenu(false);openSettings();}}>⚙️ {t.settings}</button>}
<button className="btnO" onClick={()=>{setShowMenu(false);setShowSched(true);}}>📅 جدول الماكينات</button>
{can&&<button className="btnO" onClick={()=>{setShowMenu(false);setShowLoads(true);}}>🚛 {t.loads}</button>}
<button className="btnO" onClick={()=>{setShowMenu(false);const txt=prompt("الصق نص الأمر (عميل، كود، كمية، لون...):");if(txt)extractVoice(txt);}}>📥 استيراد أمر</button>
{can&&<button className="btnO" onClick={()=>{setShowMenu(false);backupJSON();}}>💾 {t.backup}</button>}
{can&&<label className="btnO" style={{textAlign:"center"}}>📤 استرجاع<input type="file" accept=".json" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreJSON(r.result);r.readAsText(f);setShowMenu(false);}}/></label>}
<button className="btnO" onClick={()=>{setShowMenu(false);setShowAppQr(true);}}>📱 {t.appQr}</button>
<button className="btnO" onClick={undoDelete}>↩️ تراجع عن آخر حذف</button>
<button className="btnO danger" onClick={logout}>🚪 {t.logout}</button>
</div>
</div></div>)}
{showSched&&(<div className="modal" onClick={()=>setShowSched(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>📅 جدول الماكينات</h3>
<div style={{display:"flex",gap:6,marginBottom:8}}><input type="date" className="inp" style={{marginBottom:0,flex:1}} value={schedDate} onChange={e=>setSchedDate(e.target.value)}/><button className="chip" onClick={()=>exportXLS(schedCards,"machines-"+schedDate)}>📥</button></div>
<div style={{display:"flex",gap:6,marginBottom:10}}><button className={"chip"+(schedShift==="all"?" on":"")} onClick={()=>setSchedShift("all")}>الكل</button><button className={"chip"+(schedShift==="day"?" on":"")} onClick={()=>setSchedShift("day")}>☀️ صبح</button><button className={"chip"+(schedShift==="night"?" on":"")} onClick={()=>setSchedShift("night")}>🌙 ليل</button></div>
{machines.map(m=>{const cs=schedCards.filter(c=>c.machine===m);return(<div key={m} className="card" style={{padding:8}}><b>🔧 {m}</b>{cs.length===0&&<span style={{fontSize:11,color:theme.textDim}}> — فاضية</span>}{cs.map(c=>(<div key={c.id} style={{fontSize:12,marginTop:4}}>• {c.customer} · {c.code||""} · {c.stage}</div>))}</div>);})}
</div></div>)}
{reportText&&(<div className="modal" onClick={()=>setReportText("")}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>📊 {t.report}</h3>
<pre style={{whiteSpace:"pre-wrap",background:theme.panelAlt,borderRadius:12,padding:12,fontSize:13,maxHeight:"50vh",overflowY:"auto"}}>{reportText}</pre>
<div style={{display:"flex",gap:8}}><button className="btnO" onClick={()=>{try{navigator.clipboard.writeText(reportText);showToast("✅ تم النسخ");}catch(e){}}}>{t.copy}</button><a className="btnG" style={{textDecoration:"none",textAlign:"center"}} href={waLink(reportText)} target="_blank" rel="noreferrer">💬 واتساب</a></div>
</div></div>)}
{showTopCust&&(<div className="modal" onClick={()=>setShowTopCust(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>🥇 {t.topCust}</h3>
{(()=>{const mk=today.slice(0,7);const m={};cards.forEach(c=>{if(c.customer&&localDate(new Date(toMs(c.createdAt||c.updatedAt))).slice(0,7)===mk){m[c.customer]=(m[c.customer]||0)+(parseFloat(c.quantity)||0);}});const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10);if(!arr.length)return <p style={{color:theme.textDim,textAlign:"center"}}>{t.noResults}</p>;const mx=arr[0][1]||1;return arr.map(([n,q],i)=>(<div key={n} className="anim" style={{marginBottom:10,cursor:"pointer"}} onClick={()=>{setShowTopCust(false);setStatementFor(n);}}><div style={{display:"flex",justifyContent:"space-between",fontSize:13}}><span>{i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+"."} {n}</span><b style={{color:"var(--vio2)"}}>{q} {factory.unit}</b></div><div className="bar"><i style={{width:(q/mx)*100+"%",background:STAGE_COLORS[i%8]}}/></div></div>));})()}
</div></div>)}
{statementFor&&(<div className="modal" onClick={()=>setStatementFor("")}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>🧾 {t.statement} — {statementFor}</h3>
{cards.filter(c=>c.customer===statementFor).map(c=>(<div key={c.id} className="card" style={{padding:8,fontSize:12}}>{c.code||""} · {c.color||""} · {c.quantity||""} · {c.stage} {c.delivered&&"✅"}</div>))}
<div className="card grad" style={{padding:10,fontWeight:800}}>الإجمالي: {cards.filter(c=>c.customer===statementFor).reduce((a,c)=>a+(parseFloat(c.quantity)||0),0)} {factory.unit}</div>
</div></div>)}
{showWorkers&&(<div className="modal" onClick={()=>setShowWorkers(false)}><div className="mbox" onClick={e=>e.stopPropagation()} style={{maxWidth:340}}>
<h3>🏆 {t.workers}</h3>
{workerStats().length===0&&<p style={{color:theme.textDim,textAlign:"center"}}>{t.noResults}</p>}
{workerStats().map(([n,c],i)=>(<div key={n} className="card" style={{display:"flex",justifyContent:"space-between"}}><span>{i===0?"🥇":i===1?"🥈":i===2?"🥉":""} {n}</span><b style={{color:"var(--vio2)"}}>{c}</b></div>))}
</div></div>)}
{showStageMgr&&(<div className="modal" onClick={()=>setShowStageMgr(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>🎚️ إدارة المراحل</h3>
{stages.map((s,i)=>(<div key={s} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}><span style={{flex:1,fontSize:13}}>{stageIcon(s,i)} {s}</span><button className="chip" onClick={()=>moveStage(s,-1)}>⬆️</button><button className="chip" onClick={()=>moveStage(s,1)}>⬇️</button><button className="chip" onClick={()=>{const n=prompt(t.renameStage,s);if(n&&n.trim())renameStage(s,n.trim());}}>✏️</button><button className="chip" onClick={()=>{const e2=prompt("🎭 إيموجي:",(factory.stageIcons||{})[s]||"");if(e2===null)return;const mm=Object.assign({},factory.stageIcons);if(e2.trim())mm[s]=e2.trim();else delete mm[s];saveFactory({stageIcons:mm});}}>🎭</button><button className="chip" style={{color:"var(--red)"}} onClick={()=>delStage(s)}>🗑️</button></div>))}
<button className="btnG" onClick={addStage}>➕ {t.renameStage}</button>
</div></div>)}
{showLoads&&(<div className="modal" onClick={()=>setShowLoads(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>🚛 {t.loads}</h3>
<div style={grid2}><input className="inp" placeholder="العميل" value={loadDraft.customer} onChange={e=>setLoadDraft({...loadDraft,customer:e.target.value})}/><input className="inp" placeholder="الكمية الكلية" type="number" value={loadDraft.total} onChange={e=>setLoadDraft({...loadDraft,total:e.target.value})}/></div>
<button className="btnG" onClick={saveLoad}>💾 إضافة حمولة</button>
{loads.map(l=>{const s=loadStats(l);return(<div key={l.id} className="card" style={{fontSize:12}}><b>{l.customer}</b> · كلي {l.total} · مسحوب {s.pulled} · متبقي {s.rem}<div className="bar"><i style={{width:Math.max(0,Math.min(100,(s.pulled/(l.total||1))*100))+"%",background:"var(--teal)"}}/></div></div>);})}
</div></div>)}
{showImport&&importDraft&&(<div className="modal" onClick={()=>setShowImport(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>📥 {t.extracted}</h3>
<div className="lbl">{t.customer}</div><input className="inp" value={importDraft.customer} onChange={e=>setImportDraft({...importDraft,customer:e.target.value})}/>
<div style={grid2}><div><div className="lbl">{t.code}</div><input className="inp" value={importDraft.code} onChange={e=>setImportDraft({...importDraft,code:e.target.value})}/></div><div><div className="lbl">{t.quantity}</div><input className="inp" value={importDraft.quantity} onChange={e=>setImportDraft({...importDraft,quantity:e.target.value})}/></div></div>
<div style={grid2}><div><div className="lbl">{t.color}</div><input className="inp" value={importDraft.color} onChange={e=>setImportDraft({...importDraft,color:e.target.value})}/></div><div><div className="lbl">{t.machine}</div><input className="inp" value={importDraft.machine} onChange={e=>setImportDraft({...importDraft,machine:e.target.value})}/></div></div>
<div className="lbl">{t.notes}</div><textarea rows={2} className="inp" value={importDraft.notes} onChange={e=>setImportDraft({...importDraft,notes:e.target.value})}/>
<div style={{display:"flex",gap:8}}><button className="btnG" onClick={confirmImport}>💾 {t.save}</button><button className="btnO" onClick={()=>setShowImport(false)}>{t.cancel}</button></div>
</div></div>)}
{showScanner&&(<div className="modal" onClick={()=>setShowScanner(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>📷 {t.scanAny}</h3>
<input className="inp" placeholder="اكتب الكود يدوي أو امسح صورة" onKeyDown={e=>{if(e.key==="Enter"&&e.target.value)onScan(e.target.value.trim());}}/>
<button className="btnG" onClick={()=>scanFileRef.current&&scanFileRef.current.click()}>📁 صورة من الجهاز</button>
<input ref={scanFileRef} type="file" accept="image/*" style={{display:"none"}} onChange={scanFromFile}/>
</div></div>)}
{showAppQr&&(<div className="modal" onClick={()=>setShowAppQr(false)}><div className="mbox" onClick={e=>e.stopPropagation()} style={{maxWidth:340,textAlign:"center"}}>
<h3>📱 {t.appQr}</h3>
<img src={"https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(APP_URL)} style={{width:220,height:220,borderRadius:12}}/>
<p style={{fontSize:12,color:theme.textDim}}>امسحه من أي موبايل يتفتح التطبيق ويتثبت</p>
</div></div>)}
{showSettings&&(<div className="modal" onClick={()=>setShowSettings(false)}><div className="mbox" onClick={e=>e.stopPropagation()}>
<h3>⚙️ {t.settings} <button className="chip" style={{float:"left"}} onClick={()=>setShowSettings(false)}>✖️</button></h3>
<div className="lbl">🏭 اسم المصنع</div><input className="inp" defaultValue={factory.fname} onBlur={e=>saveFactory({fname:e.target.value})}/>
<div style={grid2}><div><div className="lbl">الوحدة</div><input className="inp" defaultValue={factory.unit} onBlur={e=>saveFactory({unit:e.target.value})}/></div><div><div className="lbl">تنبيه التأخير بعد (يوم)</div><input className="inp" type="number" defaultValue={factory.lateAfter} onBlur={e=>saveFactory({lateAfter:+e.target.value||1})}/></div></div>
<div className="lbl">🖼️ لوجو الشركة</div>
<div style={{display:"flex",gap:6,alignItems:"center",marginBottom:10}}>{logoSrc&&<img src={logoSrc} style={{width:44,height:44,borderRadius:10,objectFit:"cover"}}/>}<label className="chip on" style={{padding:"10px 16px"}}>📤 رفع لوجو<input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const m=Math.max(img.width,img.height);const sc=Math.min(1,256/m);const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc)||1;cv.height=Math.round(img.height*sc)||1;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);const d=cv.toDataURL("image/png");try{localStorage.setItem("logo_"+(tenant||"_"),d);}catch(x){}saveFactory({logo:d});};};img.src=rd.result;rd.readAsDataURL(f);}}/></label>{logoSrc&&<button className="chip" onClick={()=>{try{localStorage.removeItem("logo_"+(tenant||"_"));}catch(x){}saveFactory({logo:""});}}>🗑️</button>}</div>
<div className="lbl">🔑 مفتاح المالك</div><input className="inp" type="password" defaultValue={factory.ownerKey||""} onBlur={e=>saveFactory({ownerKey:e.target.value})}/>
<div className="lbl">🔒 رقم سري للإعدادات (فاضي = مقفول)</div><input className="inp" type="number" value={pinLoc} onChange={e=>{setPinLoc(e.target.value);try{localStorage.setItem("pin_"+(tenant||"_"),e.target.value);}catch(x){}}}/>
<div className="lbl">🗄️ أرشفة تلقائية للمسلّم بعد (يوم)</div><input className="inp" type="number" value={archLoc} onChange={e=>{setArchLoc(e.target.value);try{localStorage.setItem("autoArch_"+(tenant||"_"),e.target.value);}catch(x){}}}/>
<div className="lbl">📢 إعلان للعمال</div><textarea rows={2} className="inp" value={announceDraft} onChange={e=>setAnnounceDraft(e.target.value)}/>
<div style={{display:"flex",gap:8,marginBottom:10}}><button className="btnG" onClick={saveAnnounce}>📢 نشر</button><button className="btnO" onClick={()=>{db.collection("t/"+tenant+"/config").doc("announce").set({text:"",by:"",time:Date.now()});showToast("🗑️");}}>🗑️ مسح</button></div>
<div style={{display:"flex",gap:8}}><button className="btnO" onClick={()=>{setLang(lang==="ar"?"en":"ar");localStorage.setItem("pref_lang",lang==="ar"?"en":"ar");}}>🌐 {lang==="ar"?"English":"عربي"}</button><button className="btnO" onClick={()=>{setMode(mode==="dark"?"light":"dark");localStorage.setItem("pref_mode",mode==="dark"?"light":"dark");}}>{mode==="dark"?"☀️ فاتح":"🌙 داكن"}</button></div>
</div></div>)}
{toast&&<div className="toast">{toast.m}</div>}
</div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
