const arwStar=w=>(w||"").replace(/[^\u0600-\u06FF\s\*]/g," ").replace(/\s+/g," ").trim();
const cw=cut(after(/العميل/,50));
d.customer=arwStar(cw);
d.code=num(cw);
d.message=num(after(/رقم\s*الرسال[ةه]/,15));
d.machine=num(after(/الماكين[ةه]/,10));
d.color=arw(cut(after(/اسم\s*اللون/,30)));
d.category=arw(cut(after(/الخام[ةه]/,30)));
d.quantity=num(after(/الوزن/,15));
const tm=after(/تاريخ/,15).match(/\d{4}\/\d{1,2}\/\d{1,2}/);if(tm)d.time=tm[0];
const nums=flat.match(/\b26\d{5}\b/g)||[];
const shn=(after(/شترك/,14).match(/\b26\d{5}\b/)||[null])[0];
d.barcode=(nums.find(n=>n!==shn)||nums[0]||"");
const n1=arw(cut(after(/ملاحظ[ةه]/,150)));
const n2=arw(cut(after(/طلبات\s*العميل/,150)));
d.notes=(n1+" "+n2).replace(/\s+/g," ").trim();
return d;}

<div className="lbl">📳 الإحساس بالضغطات</div>
<div style={{display:"flex",gap:6,marginBottom:10}}>
<button onClick={()=>{const v=localStorage.getItem("prefVib")!=="0";localStorage.setItem("prefVib",v?"0":"1");setPrefVib(!v);}} className={"chip"+(prefVib?" on":"")}>📳 اهتزاز</button>
<button onClick={()=>{const v=localStorage.getItem("prefSnd")!=="0";localStorage.setItem("prefSnd",v?"0":"1");setPrefSnd(!v);}} className={"chip"+(prefSnd?" on":"")}>🔊 صوت</button>
</div>
{isOwner&&(
<div>
<div className="lbl">👥 إدارة العمال</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
<input className="inp" placeholder="اسم مستخدم" value={userDraft.u} onChange={e=>setUserDraft({...userDraft,u:e.target.value})}/>
<input className="inp" placeholder="الرمز" value={userDraft.p} onChange={e=>setUserDraft({...userDraft,p:e.target.value})}/>
<input className="inp" placeholder="الاسم" value={userDraft.name} onChange={e=>setUserDraft({...userDraft,name:e.target.value})}/>
</div>
<button onClick={addUser} className="btnG" style={{marginBottom:10}}>➕ إضافة عامل</button>
{users.filter(x=>x.role!=="owner").map(x=>(<div key={x.id} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}><span style={{flex:1,fontSize:13}}>👷 {x.name} ({x.id})</span><button onClick={()=>{const p=prompt("الرمز الجديد لـ "+x.id+":");if(p)resetUserPass(x.id,p);}} className="chip">🔑</button><button onClick={()=>{if(confirm("حذف "+x.id+"؟"))deleteUser(x.id);}} className="chip">🗑️</button></div>))}
<div className="lbl">🃏 تخصيص الخانات (إخفاء / أسماء / إضافة)</div>
<div style={{maxHeight:260,overflowY:"auto",marginBottom:8}}>
{[["code","كود"],["msg","رسالة"],["category","صنف"],["color","لون"],["barcode","باركود"],["quantity","كمية"],["machine","ماكينة"],["prepare","تجهيز"],["dye","صباغة"],["date","تاريخ"],["due","موعد التسليم"],["phone","تلفون العميل"],["address","عنوان العميل"],["load","الحمولة"],["deliveredQty","كمية مسلمة"],["notes","ملاحظة"],["urgent","مستعجل"]].map(f=>(<div key={f[0]} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
<span style={{flex:1,fontSize:13}}>{fLabel(f[0],f[1])}</span>
<button className={"chip"+(fHide(f[0])?"":" on")} onClick={()=>toggleField(f[0])}>{fHide(f[0])?"🚫 مخفية":"👁 ظاهرة"}</button>
<button className="chip" onClick={()=>renameField(f[0],f[1])}>✏️</button>
</div>))}
</div>
<div className="lbl">🧩 خانات خاصة بيك</div>
{(cfGet().custom||[]).map(x=>(<div key={x.id} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
<span style={{flex:1,fontSize:13}}>{x.name}</span>
<button className="chip" style={{borderColor:"var(--red)",color:"var(--red)"}} onClick={()=>delCustomField(x.id)}>🗑️</button>
</div>))}
<button className="btnO" style={{marginBottom:10}} onClick={addCustomField}>➕ إضافة خانة جديدة</button>
<div className="lbl">🎛️ خانات الكارت (بتظهر لكل عمالك)</div>
<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
<button onClick={()=>saveCardCfg({msg:!cardCfg.msg})} className={"chip"+(cardCfg.msg?" on":"")}>الرسالة</button>
<button onClick={()=>saveCardCfg({category:!cardCfg.category})} className={"chip"+(cardCfg.category?" on":"")}>الصنف</button>
<button onClick={()=>saveCardCfg({machine:!cardCfg.machine})} className={"chip"+(cardCfg.machine?" on":"")}>الماكينة</button>
<button onClick={()=>saveCardCfg({barcode:!cardCfg.barcode})} className={"chip"+(cardCfg.barcode?" on":"")}>الباركود</button>
</div>
</div>)}
{can&&(
<div>
<div className="lbl">🔒 تغيير رمزي</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
<input className="inp" type="password" placeholder="الرمز القديم" value={passDraft.old} onChange={e=>setPassDraft({...passDraft,old:e.target.value})}/>
<input className="inp" type="password" placeholder="الرمز الجديد" value={passDraft.new} onChange={e=>setPassDraft({...passDraft,new:e.target.value})}/>
</div>
<button onClick={changeMyPass} className="btnO" style={{marginBottom:10}}>🔒 تغيير رمزي</button>
</div>)}
<div className="lbl">🤖 مفتاح Gemini (اختياري — في وجود المفتاح المركزي)</div>
<input className="inp" placeholder="AIza..." value={gemKey||factory.gkey||""} onChange={e=>{setGemKey(e.target.value);localStorage.setItem("gemini_key",e.target.value.trim());saveFactory({gkey:e.target.value.trim()});}}/>
<div className="lbl">👤 {t.yourNameEdit}</div>
<div style={{display:"flex",gap:6,marginBottom:10}}><input className="inp" style={{marginBottom:0}} value={nameDraft} onChange={e=>setNameDraft(e.target.value)}/><button onClick={()=>{if(nameDraft.trim()){setOwnerName(nameDraft.trim());showToast("✅");}}} className="chip on">{t.save}</button></div>
<div className="lbl">🏭 {t.factoryName}</div>
<input className="inp" value={fnameDraft} onChange={e=>setFnameDraft(e.target.value)}/>
<div className="lbl">🖼️ لوجو الشركة</div>
<div style={{display:"flex",gap:6,alignItems:"center",marginBottom:10}}>
{logoSrc&&<img src={logoSrc} style={{width:44,height:44,borderRadius:10,objectFit:"cover"}}/>}
<button onClick={()=>{try{const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{try{const m=Math.max(img.width,img.height);const sc=Math.min(1,256/m);const c=document.createElement("canvas");c.width=Math.round(img.width*sc)||1;c.height=Math.round(img.height*sc)||1;const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);const d=c.toDataURL("image/png");setFactory(f=>({...f,logo:d}));try{localStorage.setItem("logo_"+(tenant||"_"),d);}catch(e2){}if(can&&db){db.collection("t/"+tenant+"/config").doc("settings").set({logo:d},{merge:true}).catch(e=>alert("❌ خطأ قاعدة: "+e.message));}alert("✅ اتحفظ اللوجو "+c.width+"×"+c.height);}catch(e){alert("خطأ كانفس: "+e.message);}};img.onerror=()=>alert("الصورة مش بتتحمل");img.src=rd.result;};rd.onerror=()=>alert("فشل قراءة الملف");rd.readAsDataURL(f);};document.body.appendChild(inp);inp.click();setTimeout(()=>inp.remove(),5000);}catch(e){alert("خطأ: "+e.message);}}} className="chip on">📤 رفع لوجو</button>
{logoSrc&&<button onClick={()=>{try{localStorage.removeItem("logo_"+(tenant||"_"));}catch(e){}setFactory(f=>({...f,logo:""}));if(can&&db){db.collection("t/"+tenant+"/config").doc("settings").set({logo:""},{merge:true}).catch(()=>{});}showToast("🗑️ اتشال اللوجو");}} className="chip">🗑️</button>}
</div>
<div className="lbl">🔒 رقم سري للإعدادات (سيبها فاضية = مقفول)</div>
<input className="inp" type="number" placeholder="بدون رمز" defaultValue={pinDef} onBlur={e=>{try{localStorage.setItem("pin_"+(tenant||"_"),e.target.value);}catch(x){}setFactory(f=>({...f,pin:e.target.value}));if(can&&db){db.collection("t/"+tenant+"/config").doc("settings").set({pin:e.target.value},{merge:true}).catch(()=>{});}}}/>
<div className="lbl">🗄️ أرشفة تلقائية للمسلّم بعد (يوم) — 0 مقفول</div>
<input className="inp" type="number" placeholder="0" defaultValue={archDef} onBlur={e=>{try{localStorage.setItem("autoArch_"+(tenant||"_"),e.target.value);}catch(x){}setFactory(f=>({...f,autoArch:+e.target.value||0}));if(can&&db){db.collection("t/"+tenant+"/config").doc("settings").set({autoArch:+e.target.value||0},{merge:true}).catch(()=>{});}}}/>
<div className="lbl">🌐 اللغة الافتراضية للعمال الجداد</div>
<div style={{display:"flex",gap:6,marginBottom:10}}>
<button onClick={()=>{try{localStorage.setItem("defLang","ar");}catch(e){}setFactory(f=>({...f,defaultLang:"ar"}));if(can&&db){db.collection("t/"+tenant+"/config").doc("settings").set({defaultLang:"ar"},{merge:true}).catch(()=>{});}localStorage.setItem("pref_lang","ar");setLang("ar");}} className={"chip"+((localStorage.getItem("defLang")||factory.defaultLang||"ar")==="ar"?" on":"")}>العربية</button>
<button onClick={()=>{try{localStorage.setItem("defLang","en");}catch(e){}setFactory(f=>({...f,defaultLang:"en"}));if(can&&db){db.collection("t/"+tenant+"/config").doc("settings").set({defaultLang:"en"},{merge:true}).catch(()=>{});}localStorage.setItem("pref_lang","en");setLang("en");}} className={"chip"+((localStorage.getItem("defLang")||factory.defaultLang)==="en"?" on":"")}>English</button>
</div>
<div style={grid2}>
<div><div className="lbl">⚖️ {t.unit}</div><select className="inp" value={factory.unit} onChange={e=>saveFactory({unit:e.target.value})}>{["كيلو","قطعة","متر","دستة","طن"].map(u=><option key={u}>{u}</option>)}</select></div>
<div><div className="lbl">🖨️ {t.printSize}</div><select className="inp" value={factory.printSize} onChange={e=>saveFactory({printSize:e.target.value})}>{["A5","A4"].map(u=><option key={u}>{u}</option>)}</select></div>
</div>
<div className="lbl">⏰ {t.lateDays}</div>
<input className="inp" type="number" min="1" value={lateDraft} onChange={e=>setLateDraft(e.target.value)}/>
<button onClick={saveFactoryDrafts} className="btnG" style={{marginBottom:10}}>💾 {t.saveFactoryBtn}</button>
<div className="lbl">🎚️ {t.manageStages}</div>
<div style={{marginBottom:10}}>{stages.map(s=>(<div key={s} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}><span style={{flex:1,fontSize:13}}>{s}</span><button onClick={()=>{const n=prompt(t.rename,s);if(n&&n.trim()&&n!==s)renameStage(s,n.trim());}} className="chip">✏️</button><button onClick={()=>{if(confirm(t.delete+" "+s))saveStages(stages.filter(x=>x!==s));}} className="chip">🗑️</button></div>))}
<button onClick={()=>{const n=prompt(t.addStage);if(n&&n.trim()&&!stages.includes(n.trim()))saveStages(stages.concat([n.trim()]));}} className="chip" style={{marginTop:4}}>➕</button></div>
<div className="lbl">🔧 {t.manageMachines}</div>
<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>{machines.map(m=><button key={m} onClick={()=>{if(confirm(t.delete+" "+m))saveMachines(machines.filter(x=>x!==m));}} className="chip">{m} ✕</button>)}<button onClick={()=>{const n=prompt(t.add);if(n&&n.trim()&&!machines.includes(n.trim()))saveMachines(machines.concat([n.trim()]));}} className="chip on">➕</button></div>
<div className="lbl">🎨 {t.manageColors}</div>
<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>{customColors.map(c=><button key={c} onClick={()=>saveColors(customColors.filter(x=>x!==c))} className="chip">{c} ✕</button>)}<button onClick={()=>{const n=prompt(t.add);if(n&&n.trim())saveColors(customColors.concat([n.trim()]));}} className="chip on">➕</button></div>
<div style={{...grid2,marginTop:8}}>
<button onClick={()=>setAppQr(true)} className="btnO">🔳 {t.appQr}</button>
<button onClick={()=>backupJSON()} className="btnO">💾 {t.backupFull}</button>
<button onClick={()=>restoreRef.current&&restoreRef.current.click()} className="btnO">♻️ {t.restore}</button>
<button onClick={()=>{if(wipeConfirm){wipeAll();}else{setWipeConfirm(true);setTimeout(()=>setWipeConfirm(false),3000);}}} className="btnO" style={{borderColor:"var(--red)",color:wipeConfirm?"#fff":"var(--red)",background:wipeConfirm?"var(--red)":"transparent"}}>{wipeConfirm?"⚠️ "+t.wipeSure:"🗑️ "+t.wipe}</button>
</div>
</div></div>)}
{confetti&&(<div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:998,overflow:"hidden"}}>{Array.from({length:40}).map((_,i)=>(<span key={i} style={{position:"absolute",top:"-10px",insetInlineStart:(i*2.5)+"%",width:8,height:12,background:["#7C5CFF","#2DD4A8","#FFB65C","#FF5C7A","#4CC9F0"][i%5],borderRadius:3,animation:"confFall 2.6s linear "+((i%10)*0.12)+"s both"}}/>))}</div>)}
{toast&&(<div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",background:toast.kind==="danger"?"var(--red)":"var(--teal)",color:"#fff",padding:"10px 18px",borderRadius:30,fontSize:14,fontWeight:800,zIndex:999,animation:"pop .3s both",boxShadow:"0 8px 24px rgba(0,0,0,.4)",display:"flex",alignItems:"center",gap:10}}>{toast.msg}{toast.action&&<button onClick={()=>{toast.action.fn();setToast(null);}} style={{background:"rgba(255,255,255,.25)",border:"none",color:"#fff",borderRadius:20,padding:"5px 12px",fontSize:12,fontWeight:800}}>{toast.action.label}</button>}</div>)}
</div>);
}
function SearchModal({t,cards,onPick,favs}){
const [q,setQ]=useState("");
const r=q.trim()?cards.filter(c=>FIELD_KEYS.some(k=>(c[k]||"").toString().toLowerCase().includes(q.toLowerCase()))).slice(0,20):[];
return(<div>{favs&&favs.length>0&&(<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>{favs.map(f=><button key={f} onClick={()=>setQ(f)} className="chip on" style={{marginBottom:4}}>⭐ {f}</button>)}</div>)}<input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder={t.search} className="inp"/>
{q.trim()&&r.length===0&&<p style={{color:"var(--dim)",fontSize:13,textAlign:"center"}}>{t.noResults}</p>}
<div>{r.map((c,i)=>(<div key={c.id} onClick={()=>onPick(c)} className="card anim" style={{cursor:"pointer",padding:"10px 12px",marginBottom:8,animationDelay:(i*40)+"ms"}}><b style={{fontSize:14}}>{c.customer} · {c.code}</b><div style={{fontSize:12,color:"var(--dim)"}}>{c.stage} — {c.color}</div></div>))}</div></div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
window.__booted=true;
</script>
</body>
</html>
