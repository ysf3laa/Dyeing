<div onClick={e=>e.stopPropagation()} style={{background:theme.panel,borderRadius:18,padding:20,width:"100%",maxWidth:400,maxHeight:"88vh",overflowY:"auto",border:"1px solid "+theme.border}}>
<h3 style={{margin:"0 0 14px"}}>⚙️ {t.settings}</h3>
{lbl("🌐 "+t.language)}<div style={{marginBottom:10}}><button onClick={()=>{const n=lang==="ar"?"en":"ar";setLang(n);localStorage.setItem("pref_lang",n);}} style={chip(true)}>{lang==="ar"?"العربية":"English"}</button></div>
{lbl((dark?"🌙":"☀️ ")+" "+t.darkMode)}<div style={{marginBottom:10}} onClick={()=>{const n=!dark;setDark(n);localStorage.setItem("pref_dark",n);}}><div style={{width:44,height:24,borderRadius:20,background:dark?theme.accent:theme.border,position:"relative",cursor:"pointer"}}><div style={{width:18,height:18,borderRadius:"50%",background:"#fff",position:"absolute",top:3,insetInlineStart:dark?23:3}}/></div></div>
{!can&&(<div style={{background:theme.panelAlt,borderRadius:12,padding:14,marginBottom:10}}>
{lbl("🔑 "+t.unlockTitle)}
<input style={{...inputStyle,marginBottom:6}} inputMode="numeric" value={codeInput} onChange={e=>setCodeInput(e.target.value)} placeholder="******"/>
<button onClick={tryUnlock} style={{...btnPrimary,width:"100%"}}>🔓 {t.confirmName}</button>
<p style={{fontSize:11,color:theme.textDim,marginTop:8}}>{t.unlockHint}</p>
</div>)}
{can&&(<>
{lbl("🤖 مفتاح Gemini (قراءة ذكية لكل العمال)")}<input style={inputStyle} placeholder="AIza..." value={gemKey||factory.gkey||""} onChange={e=>{setGemKey(e.target.value);localStorage.setItem("gemini_key",e.target.value.trim());saveFactory({gkey:e.target.value.trim()});}}/>
<p style={{fontSize:11,color:theme.textDim,marginBottom:8}}>مفتاح مجاني من aistudio.google.com/app/apikey — احطه مرة واحدة ويشتغل عند كل العمال تلقائياً</p>
{lbl("👤 "+t.yourNameEdit)}<div style={{display:"flex",gap:6,marginBottom:10}}><input style={{...inputStyle,marginBottom:0}} value={nameDraft} onChange={e=>setNameDraft(e.target.value)}/><button onClick={()=>{if(nameDraft.trim()){setOwnerName(nameDraft.trim());localStorage.setItem("owner_name_"+userId,nameDraft.trim());showToast("✅");}}} style={{...chip(true),padding:"10px 14px"}}>{t.save}</button></div>
{lbl("🏭 "+t.factoryName)}<input style={inputStyle} value={fnameDraft} onChange={e=>setFnameDraft(e.target.value)}/>
{lbl("📱 "+t.waNumber)}<input style={inputStyle} inputMode="numeric" placeholder="201xxxxxxxxx" value={waDraft} onChange={e=>setWaDraft(e.target.value)}/>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
<div>{lbl("⚖️ "+t.unit)}<select style={inputStyle} value={factory.unit} onChange={e=>saveFactory({unit:e.target.value})}>{["كيلو","قطعة","متر","دستة","طن"].map(u=><option key={u}>{u}</option>)}</select></div>
<div>{lbl("🖨️ "+t.printSize)}<select style={inputStyle} value={factory.printSize} onChange={e=>saveFactory({printSize:e.target.value})}>{["A5","A4"].map(u=><option key={u}>{u}</option>)}</select></div></div>
{lbl("⏰ "+t.lateDays)}<input style={inputStyle} type="number" min="1" value={lateDraft} onChange={e=>setLateDraft(e.target.value)}/>
<button onClick={saveFactoryDrafts} style={{...btnPrimary,width:"100%",marginBottom:10}}>💾 {t.saveFactoryBtn}</button>
{lbl("🎚️ "+t.manageStages)}<div style={{marginBottom:10}}>{stages.map(s=>(<div key={s} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}><span style={{flex:1,fontSize:13}}>{s}</span><button onClick={()=>{const n=prompt(t.rename,s);if(n&&n.trim()&&n!==s)renameStage(s,n.trim());}} style={chip(false)}>✏️</button><button onClick={()=>{if(confirm("حذف "+s+"؟"))saveStages(stages.filter(x=>x!==s));}} style={chip(false)}>🗑️</button></div>))}
<button onClick={()=>{const n=prompt(t.addStage);if(n&&n.trim()&&!stages.includes(n.trim()))saveStages(stages.concat([n.trim()]));}} style={{...chip(false),marginTop:4}}>➕</button></div>
{lbl("🔧 "+t.manageMachines)}<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>{machines.map(m=><button key={m} onClick={()=>{if(confirm("حذف "+m+"؟"))saveMachines(machines.filter(x=>x!==m));}} style={chip(false)}>{m} ✕</button>)}<button onClick={()=>{const n=prompt(t.add);if(n&&n.trim()&&!machines.includes(n.trim()))saveMachines(machines.concat([n.trim()]));}} style={chip(true)}>➕</button></div>
{lbl("🎨 "+t.manageColors)}<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>{customColors.map(c=><button key={c} onClick={()=>saveColors(customColors.filter(x=>x!==c))} style={chip(false)}>{c} ✕</button>)}<button onClick={()=>{const n=prompt(t.add);if(n&&n.trim())saveColors(customColors.concat([n.trim()]));}} style={chip(true)}>➕</button></div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:8}}>
<button onClick={()=>setAppQr(true)} style={btnGhost}>🔳 {t.appQr}</button>
<button onClick={()=>backupJSON()} style={btnGhost}>💾 {t.backupFull}</button>
<button onClick={()=>restoreRef.current&&restoreRef.current.click()} style={btnGhost}>♻️ {t.restore}</button>
<button onClick={()=>{if(wipeConfirm){wipeAll();}else{setWipeConfirm(true);setTimeout(()=>setWipeConfirm(false),3000);}}} style={{...btnGhost,border:"1px solid "+theme.danger,color:wipeConfirm?"#fff":theme.danger,background:wipeConfirm?theme.danger:"transparent"}}>{wipeConfirm?"⚠️ "+t.wipeSure:"🗑️ "+t.wipe}</button>
</div></>)}
</div></div>)}
{toast&&(<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:toast.kind==="danger"?theme.danger:theme.accent2,color:"#fff",padding:"10px 20px",borderRadius:30,fontSize:14,fontWeight:600,zIndex:999}}>{toast.msg}</div>)}
</div>);
}
function SearchModal({theme,t,cards,onPick,inputStyle}){
const [q,setQ]=useState("");
const r=q.trim()?cards.filter(c=>FIELD_KEYS.some(k=>(c[k]||"").toString().toLowerCase().includes(q.toLowerCase()))).slice(0,20):[];
return(<div><input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder={t.search} style={inputStyle}/>
{q.trim()&&r.length===0&&<p style={{color:theme.textDim,fontSize:13,textAlign:"center"}}>{t.noResults}</p>}
<div style={{display:"flex",flexDirection:"column",gap:8}}>{r.map(c=>(<div key={c.id} onClick={()=>onPick(c)} style={{cursor:"pointer",background:theme.panelAlt,borderRadius:10,padding:"10px 12px"}}><b style={{fontSize:14}}>{c.customer} · {c.code}</b><div style={{fontSize:12,color:theme.textDim}}>{c.stage} — {c.color}</div></div>))}</div></div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
window.__booted=true;
</script>
</body>
</html>value
