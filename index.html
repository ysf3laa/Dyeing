<input autoFocus value={newStageName} onChange={e=>setNewStageName(e.target.value)} placeholder={t.stageNamePlaceholder} style={inputStyle} onKeyDown={e=>e.key==="Enter"&&addStage()}/>
<div style={{display:"flex",gap:8,marginTop:12}}>
<button onClick={addStage} style={btnPrimary}>{t.add}</button>
<button onClick={()=>setShowAddStage(false)} style={btnGhost}>{t.cancel}</button>
</div>
</div>
</div>)}

{toast&&(
<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:toast.kind==="danger"?theme.danger:theme.accent2,color:"#fff",padding:"10px 20px",borderRadius:30,fontSize:14,fontWeight:600,zIndex:999,boxShadow:"0 8px 24px rgba(0,0,0,.25)"}}>{toast.msg}</div>)}
</div>);
}
function SearchModal({theme,t,cards,onPick,inputStyle}){
const [q,setQ]=useState("");
const results=q.trim()?cards.filter(c=>FIELD_KEYS.some(k=>(c[k]||"").toString().toLowerCase().includes(q.toLowerCase()))).slice(0,20):[];
return(<div>
<input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder={t.search} style={inputStyle}/>
{q.trim()&&results.length===0&&<p style={{color:theme.textDim,fontSize:13,textAlign:"center"}}>{t.noResults}</p>}
<div style={{display:"flex",flexDirection:"column",gap:8}}>
{results.map(c=>(<div key={c.id} onClick={()=>onPick(c)} style={{cursor:"pointer",background:theme.panelAlt,borderRadius:10,padding:"10px 12px"}}>
<div style={{fontWeight:700,fontSize:14}}>{c.customer} · {c.code}</div>
<div style={{fontSize:12,color:theme.textDim}}>{c.stage} — {c.color} — {c.quantity}</div>
</div>))}
</div>
</div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
